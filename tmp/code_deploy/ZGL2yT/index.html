<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>短博客 · 时光</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="nav | flex-row">
        <a href="/" class="nav__logo" aria-label="首页">📘 短言</a>
        <button class="nav__toggle" aria-label="菜单切换" aria-expanded="false">☰</button>
        <ul class="nav__menu | flex-row" role="list">
            <li><a href="/" class="nav__link" aria-current="page">首页</a></li>
            <li><a href="#about" class="nav__link">关于</a></li>
        </ul>
    </nav>

    <main class="container">
        <section class="card-grid" id="cardGrid" aria-label="文章卡片列表">
            <!-- 由 JavaScript 动态生成 6 张卡片 -->
        </section>
    </main>

    <footer class="footer | flex-center">
        <p>© <span id="year"></span> 短博客 · 自在书写</p>
    </footer>

    <script src="script.js" defer></script>

</html>
