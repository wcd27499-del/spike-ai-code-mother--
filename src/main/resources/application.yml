spring:
  profiles:
    active: local
  application:
    name: spike-ai-code-mother
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/spike_ai_code_mother
    username: root
    password: 123456
  data:
    redis:
      host: localhost
      port: 6379
      password:
      ttl: 3600
      database: 0
  session:
    store-type: redis
    #30天过期
    timeout: 2592000
server:
  port: 8555
  servlet:
    context-path: /api
    session:
      cookie:
        max-age: 2592000

#springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: com.spike.spikeaicodemother.genresult.controller
#knief4j
knife4j:
  enable: true
  setting:
    language: zh_cn




